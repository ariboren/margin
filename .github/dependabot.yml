version: 2
updates:
    - package-ecosystem: bun
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      groups:
          bun:
              patterns: ["*"]
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      groups:
          actions:
              patterns: ["*"]
