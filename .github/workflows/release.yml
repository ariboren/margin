name: Release

on:
    release:
        types: [published]

permissions: {}

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    # The same checks as ci.yml, without caches: a release run must not restore state that another
    # workflow could have written.
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Check the tag matches package.json
              id: version
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  version=$(jq -r .version package.json)
                  if [ "$TAG" != "v$version" ]; then
                      echo "::error::Release tag $TAG does not match package.json version v$version"
                      exit 1
                  fi
                  echo "version=$version" >> "$GITHUB_OUTPUT"
            - name: Audit workflows with zizmor
              uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
              with:
                  version: 1.30.1
                  min-severity: medium
                  advanced-security: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  no-cache: true
            - run: bun install --frozen-lockfile
            - run: bun run typecheck
            - name: Test with coverage
              run: bun run coverage
            - run: bun run budget
            - run: bun skill/generate.ts --check
            - run: bun run pack-check
            - name: Pack the tarball to publish
              run: bun pm pack --destination "$RUNNER_TEMP/pack" --quiet
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: tarball
                  path: ${{ runner.temp }}/pack/*.tgz
                  if-no-files-found: error

    # Publishes the tarball verify packed, through npm trusted publishing (OIDC), so no token is
    # stored and provenance is attached. bun publish has no OIDC support, hence npm.
    publish:
        needs: verify
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment: npm
        permissions:
            id-token: write # OIDC token for npm trusted publishing and provenance
        steps:
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: tarball
                  path: ${{ runner.temp }}/pack
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  package-manager-cache: false
            - name: Check npm supports trusted publishing
              run: |
                  npm_version=$(npm --version)
                  if ! printf '%s\n' 11.5.1 "$npm_version" | sort -V -C; then
                      echo "::error::npm $npm_version is older than 11.5.1, the minimum for trusted publishing"
                      exit 1
                  fi
            - name: Publish to npm
              env:
                  VERSION: ${{ needs.verify.outputs.version }}
              run: |
                  args=(--provenance)
                  if [[ "$VERSION" == *-* ]]; then
                      args+=(--tag next)
                  fi
                  npm publish "$RUNNER_TEMP/pack/margin-md-$VERSION.tgz" "${args[@]}"
