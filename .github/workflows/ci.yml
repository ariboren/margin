name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  # With tags: a test checks the hashes of the skills in past releases against them.
                  fetch-depth: 0
            - name: Audit workflows with zizmor
              uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
              with:
                  version: 1.30.1
                  min-severity: medium
                  advanced-security: false
            # Reads the version from packageManager in package.json.
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.bun/install/cache
                  key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
                  restore-keys: bun-${{ runner.os }}-
            - run: bun install --frozen-lockfile
            - run: bun run typecheck
            - name: Test with coverage
              run: bun run coverage
            # An explicit bash shell runs with -eo pipefail (the implicit default is only -e),
            # so a breach fails this step after every row has reached the summary.
            - name: Token budget
              shell: bash
              run: |
                  echo '### Token budget' >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  bun run budget | tee -a "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
            - run: bun skill/generate.ts --check
            - run: bun run pack-check
